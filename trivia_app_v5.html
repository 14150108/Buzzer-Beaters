
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
.screen{display:none;padding:1.5rem 1.25rem}
.screen.active{display:block}
.home-hero{text-align:center;padding:2rem 0 1rem}
.home-hero h1{font-size:24px;font-weight:600;color:#1e1b4b;margin-bottom:6px;letter-spacing:-.3px}
.home-hero p{font-size:14px;color:#6b7280;line-height:1.6;max-width:380px;margin:0 auto 1.5rem}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin:0 auto}
.mode-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:1.25rem;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
.mode-card:hover{border-color:#6366f1;box-shadow:0 0 0 3px #eef2ff}
.mode-card .mode-icon{font-size:22px;margin-bottom:8px}
.mode-card h3{font-size:15px;font-weight:600;color:#1e1b4b;margin-bottom:4px}
.mode-card p{font-size:13px;color:#6b7280;line-height:1.5}
.mode-card.quiz-card .mode-icon{color:#6366f1}
.mode-card.reader-card .mode-icon{color:#0891b2}
.settings-box{max-width:480px;margin:1.25rem auto 0;background:#f8f7ff;border:1px solid #e0e7ff;border-radius:14px;padding:1rem 1.25rem}
.settings-box h3{font-size:11px;font-weight:600;color:#6366f1;margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setting-col label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}
.setting-col select{width:100%;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid #c7d2fe;background:#fff;color:#1e1b4b}
.start-btn{display:block;width:100%;max-width:180px;margin:1.25rem auto 0;padding:10px 20px;border-radius:8px;border:none;background:#6366f1;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.start-btn:hover{background:#4f46e5}
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.q-back{font-size:13px;color:#6366f1;cursor:pointer;background:none;border:none;font-weight:500}
.q-back:hover{color:#4f46e5}
.q-badge{font-size:12px;color:#6366f1;background:#eef2ff;border-radius:20px;padding:4px 12px;font-weight:500}
.streak-badge{font-size:12px;color:#d97706;font-weight:600;visibility:hidden;background:#fef3c7;border-radius:20px;padding:4px 10px}
.cat-tag{font-size:12px;color:#9ca3af;margin-bottom:.6rem;display:flex;align-items:center;gap:5px}
.diff-pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.easy .diff-pill{background:#dcfce7;color:#15803d}
.medium .diff-pill{background:#fef9c3;color:#a16207}
.hard .diff-pill{background:#fee2e2;color:#b91c1c}
.q-text{font-size:17px;font-weight:500;color:#111827;line-height:1.55;margin-bottom:1.25rem}
.answers{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.ans-btn{text-align:left;padding:12px 16px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;color:#374151;font-size:14px;cursor:pointer;line-height:1.4;transition:background .1s,border-color .1s}
.ans-btn:hover:not(:disabled){background:#f5f3ff;border-color:#a5b4fc}
.ans-btn.correct{background:#dcfce7;border-color:#4ade80;color:#15803d;font-weight:500}
.ans-btn.wrong{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.ans-btn:disabled{cursor:default}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1.5px solid #e0e7ff;padding-top:1rem;margin-top:.5rem}
.stat-card{background:#f8f7ff;border-radius:10px;padding:.75rem;text-align:center;border:1px solid #e0e7ff}
.stat-label{font-size:11px;color:#818cf8;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-size:20px;font-weight:600;color:#1e1b4b}
.stat-value.green{color:#16a34a}
.reader-nav-bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(4px);border-bottom:1px solid #e0e7ff;display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem;margin:0 -1.25rem 1rem}
.reader-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:1.25rem;margin-bottom:12px}
.reader-card:hover{border-color:#c7d2fe}
.reader-q{font-size:15px;font-weight:500;color:#111827;line-height:1.6;margin-bottom:.75rem}
.reader-answer{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#dcfce7;border:1px solid #4ade80;border-radius:8px;font-size:14px;font-weight:500;color:#15803d}
.loading{text-align:center;padding:2rem 0;color:#9ca3af;font-size:14px}
.retry-msg{text-align:center;padding:1rem;color:#f59e0b;font-size:13px;font-weight:500}
.sentinel{height:40px}
</style>

<h2 style="position:absolute;left:-9999px">Trivia App</h2>

<div id="home" class="screen active">
  <div class="home-hero">
    <h1>Trivia</h1>
    <p>Pick a mode to get started</p>
    <div class="mode-grid">
      <div class="mode-card quiz-card" onclick="goMode('quiz')">
        <div class="mode-icon">∞</div>
        <h3>Infinite quiz</h3>
        <p>Answer endlessly, track streak and accuracy live</p>
      </div>
      <div class="mode-card reader-card" onclick="goMode('reader')">
        <div class="mode-icon">☰</div>
        <h3>Reader mode</h3>
        <p>Scroll through Q&amp;As — great for quizzing a group</p>
      </div>
    </div>
    <div class="settings-box">
      <h3>Settings</h3>
      <div class="settings-grid">
        <div class="setting-col">
          <label>Category</label>
          <select id="cat-select">
            <option value="">Any</option>
            <option value="9">General knowledge</option>
            <option value="10">Books</option>
            <option value="11">Film</option>
            <option value="12">Music</option>
            <option value="14">Television</option>
            <option value="15">Video games</option>
            <option value="17">Science &amp; nature</option>
            <option value="18">Computers</option>
            <option value="19">Mathematics</option>
            <option value="20">Mythology</option>
            <option value="21">Sports</option>
            <option value="22">Geography</option>
            <option value="23">History</option>
            <option value="25">Art</option>
            <option value="27">Animals</option>
          </select>
        </div>
        <div class="setting-col">
          <label>Difficulty</label>
          <select id="diff-select">
            <option value="">Any</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>
    </div>
    <button class="start-btn" onclick="goMode('quiz')">Start quiz →</button>
  </div>
</div>

<div id="quiz" class="screen">
  <div class="q-header">
    <button class="q-back" onclick="goHome()">← Home</button>
    <span class="q-badge" id="quiz-num">Question 1</span>
    <span class="streak-badge" id="streak-display">🔥 <span id="streak-num">0</span></span>
  </div>
  <div id="quiz-body"></div>
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-label">Answered</div><div class="stat-value" id="stat-total">0</div></div>
    <div class="stat-card"><div class="stat-label">Correct</div><div class="stat-value green" id="stat-correct">0</div></div>
    <div class="stat-card"><div class="stat-label">Accuracy</div><div class="stat-value" id="stat-acc">—</div></div>
    <div class="stat-card"><div class="stat-label">Avg time</div><div class="stat-value" id="stat-time">—</div></div>
  </div>
</div>

<div id="reader" class="screen" style="padding-top:0">
  <div class="reader-nav-bar">
    <button class="q-back" onclick="goHome()">← Home</button>
    <span class="q-badge" id="reader-badge">Reader mode</span>
    <span></span>
  </div>
  <div id="reader-list"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="loading" id="reader-loading" style="display:none">Loading more…</div>
</div>

<script>
const dec=s=>new DOMParser().parseFromString(s,'text/html').body.textContent;
const shuffle=a=>a.sort(()=>Math.random()-.5);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let qIdx=0,answered=0,correct=0,streak=0,pool=[];
let curCat='',curDiff='';
let readerCount=0,readerLoading=false,readerObserver=null;
let qStartTime=0,totalTime=0;

function goHome(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('home').classList.add('active');
  qIdx=0;answered=0;correct=0;streak=0;pool=[];
  readerCount=0;readerLoading=false;totalTime=0;
  if(readerObserver){readerObserver.disconnect();readerObserver=null;}
  document.getElementById('reader-list').innerHTML='';
}

function goMode(m){
  curCat=document.getElementById('cat-select').value;
  curDiff=document.getElementById('diff-select').value;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(m).classList.add('active');
  if(m==='quiz'){
    answered=0;correct=0;streak=0;qIdx=0;totalTime=0;
    updateStats();
    document.getElementById('streak-display').style.visibility='hidden';
    loadAndShow();
  } else {
    readerCount=0;readerLoading=false;
    document.getElementById('reader-list').innerHTML='';
    document.getElementById('reader-loading').style.display='none';
    startReaderScroll();
  }
}

async function fetchQ(amount){
  let url=`https://opentdb.com/api.php?amount=${amount}&type=multiple`;
  if(curCat) url+=`&category=${curCat}`;
  if(curDiff) url+=`&difficulty=${curDiff}`;
  const r=await fetch(url);
  const d=await r.json();
  if(d.response_code===5) throw new Error('ratelimit');
  if(d.response_code!==0) throw new Error('api');
  return d.results;
}

async function loadAndShow(){
  if(pool.length===0){
    document.getElementById('quiz-body').innerHTML='<div class="loading">Loading…</div>';
    try{ pool=shuffle(await fetchQ(50)); }
    catch(e){
      if(e.message==='ratelimit'){
        document.getElementById('quiz-body').innerHTML='<div class="loading">Rate limited — retrying…</div>';
        await wait(5500);
        return loadAndShow();
      }
      document.getElementById('quiz-body').innerHTML='<div class="loading" style="color:#dc2626">Could not load questions.</div>';
      return;
    }
  }
  showQuizQ(pool.shift());
}

function diffClass(d){return d==='easy'?'easy':d==='medium'?'medium':'hard';}

function showQuizQ(q){
  qIdx++;
  qStartTime=Date.now();
  document.getElementById('quiz-num').textContent='Question '+qIdx;
  const correctDec=dec(q.correct_answer);
  const answers=shuffle([...q.incorrect_answers.map(dec),correctDec]);
  document.getElementById('quiz-body').innerHTML=`
    <div class="cat-tag ${diffClass(q.difficulty)}">${dec(q.category)} <span class="diff-pill">${q.difficulty}</span></div>
    <div class="q-text">${dec(q.question)}</div>
    <div class="answers">
      ${answers.map(a=>`<button class="ans-btn" data-val="${a.replace(/"/g,'&quot;')}">${a}</button>`).join('')}
    </div>
  `;
  document.querySelectorAll('.ans-btn').forEach(btn=>{
    btn.addEventListener('click',()=>pickAnswer(btn,correctDec));
  });
}

function pickAnswer(btn,correctDec){
  const elapsed=(Date.now()-qStartTime)/1000;
  totalTime+=elapsed;
  document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
  const isCorrect=btn.dataset.val===correctDec;
  if(isCorrect){btn.classList.add('correct');}
  else{btn.classList.add('wrong');document.querySelectorAll('.ans-btn').forEach(b=>{if(b.dataset.val===correctDec)b.classList.add('correct');});}
  answered++;if(isCorrect){correct++;streak++;}else{streak=0;}
  updateStats();
  const sd=document.getElementById('streak-display');
  if(streak>=2){sd.style.visibility='visible';document.getElementById('streak-num').textContent=streak;}else{sd.style.visibility='hidden';}
  setTimeout(loadAndShow,isCorrect?900:1400);
}

function updateStats(){
  document.getElementById('stat-total').textContent=answered;
  document.getElementById('stat-correct').textContent=correct;
  document.getElementById('stat-acc').textContent=answered?Math.round(correct/answered*100)+'%':'—';
  document.getElementById('stat-time').textContent=answered?(totalTime/answered).toFixed(1)+'s':'—';
}

function startReaderScroll(){
  loadMoreReader();
  readerObserver=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting&&!readerLoading) loadMoreReader();
  },{rootMargin:'400px'});
  readerObserver.observe(document.getElementById('sentinel'));
}

async function loadMoreReader(){
  if(readerLoading) return;
  readerLoading=true;
  document.getElementById('reader-loading').style.display='block';
  try{
    if(readerCount>0) await wait(5500);
    const batch=await fetchQ(20);
    const list=document.getElementById('reader-list');
    batch.forEach(q=>{
      readerCount++;
      const correctDec=dec(q.correct_answer);
      const card=document.createElement('div');
      card.className='reader-card';
      card.innerHTML=`
        <div class="cat-tag ${diffClass(q.difficulty)}">${dec(q.category)} <span class="diff-pill">${q.difficulty}</span></div>
        <div class="reader-q">${readerCount}. ${dec(q.question)}</div>
        <div class="reader-answer">✓ ${correctDec}</div>
      `;
      list.appendChild(card);
    });
    document.getElementById('reader-badge').textContent=readerCount+' questions loaded';
  }catch(e){
    if(e.message==='ratelimit'){
      document.getElementById('reader-list').insertAdjacentHTML('beforeend','<div class="retry-msg">⏳ Rate limited — waiting 5s then retrying…</div>');
      await wait(5500);
      document.querySelector('.retry-msg')?.remove();
      readerLoading=false;
      return loadMoreReader();
    }
    document.getElementById('reader-list').insertAdjacentHTML('beforeend','<div class="loading" style="color:#dc2626">Could not load more — scroll to retry.</div>');
  }
  document.getElementById('reader-loading').style.display='none';
  readerLoading=false;
}
</script>
