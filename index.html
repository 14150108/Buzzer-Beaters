<link rel="stylesheet" href="styles.css">

<h2 style="position:absolute;left:-9999px">Trivia App</h2>

<div id="home" class="screen active">
  <div class="home-hero">
    <h1>Trivia</h1>
    <p>Pick a mode to get started</p>
    <div class="mode-grid">
      <div class="mode-card quiz-card" onclick="goMode('quiz')">
        <div class="mode-icon">∞</div>
        <h3>Infinite quiz</h3>
        <p>Answer endlessly, track streak and accuracy live</p>
      </div>
      <div class="mode-card reader-card" onclick="goMode('reader')">
        <div class="mode-icon">☰</div>
        <h3>Reader mode</h3>
        <p>Scroll through Q&amp;As — great for quizzing a group</p>
      </div>
    </div>
    <div class="settings-box">
      <h3>Settings</h3>
      <div class="settings-grid">
        <div class="setting-col">
          <label>Category</label>
          <select id="cat-select">
            <option value="">Any</option>
            <option value="9">General knowledge</option>
            <option value="10">Books</option>
            <option value="11">Film</option>
            <option value="12">Music</option>
            <option value="14">Television</option>
            <option value="15">Video games</option>
            <option value="17">Science &amp; nature</option>
            <option value="18">Computers</option>
            <option value="19">Mathematics</option>
            <option value="20">Mythology</option>
            <option value="21">Sports</option>
            <option value="22">Geography</option>
            <option value="23">History</option>
            <option value="25">Art</option>
            <option value="27">Animals</option>
          </select>
        </div>
        <div class="setting-col">
          <label>Difficulty</label>
          <select id="diff-select">
            <option value="">Any</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="quiz" class="screen">
  <div class="q-nav-bar">
    <button class="q-back" onclick="goHome()">← Home</button>
    <span class="q-badge" id="quiz-num">Question 1</span>
    <span class="streak-badge" id="streak-display">🔥 <span id="streak-num">0</span></span>
  </div>
  <div id="quiz-body"></div>
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-label">Answered</div><div class="stat-value" id="stat-total">0</div></div>
    <div class="stat-card"><div class="stat-label">Correct</div><div class="stat-value green" id="stat-correct">0</div></div>
    <div class="stat-card"><div class="stat-label">Accuracy</div><div class="stat-value" id="stat-acc">—</div></div>
    <div class="stat-card"><div class="stat-label">Avg time</div><div class="stat-value" id="stat-time">—</div></div>
  </div>
</div>

<div id="reader" class="screen" style="padding-top:0">
  <div class="reader-nav-bar">
    <button class="q-back" onclick="goHome()">← Home</button>
    <span class="q-badge" id="reader-badge">Reader mode</span>
    <span></span>
  </div>
  <div id="reader-list"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="loading" id="reader-loading" style="display:none">Loading more…</div>
</div>
<script src="script.js"></script>
